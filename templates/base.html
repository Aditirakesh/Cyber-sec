<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cyber-sec Lab{% endblock %}</title>
<style>
:root{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e2229; --border:#2a2f3a;
  --text:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --accent-2:#8f6bff;
  --danger:#ff5d6c; --danger-bg:#3a1c22; --success:#36d399; --success-bg:#123327;
  --warn:#ffc156; --warn-bg:#3a2e12; --radius:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border)}
.topwrap{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;padding:.9rem 1.25rem}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:.5rem}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
nav a{color:var(--muted);font-size:.92rem}
nav a:hover{color:var(--text);text-decoration:none}
main{max-width:900px;margin:0 auto;padding:2rem 1.25rem 4rem}
.banner{background:var(--warn-bg);border:1px solid #6b5420;color:var(--warn);
  border-radius:var(--radius);padding:.7rem 1rem;font-size:.9rem;margin-bottom:1.75rem}
h1{font-size:1.6rem;margin:.2rem 0 1rem}
h2{font-size:1.15rem;margin-top:2rem}
h3{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1.6rem}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;
  letter-spacing:.03em;text-transform:uppercase}
.badge.vuln{background:var(--danger-bg);color:var(--danger)}
.badge.fixed{background:var(--success-bg);color:var(--success)}
.badge.todo{background:var(--surface-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.1rem 1.25rem;margin-bottom:.85rem;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.cardlink{display:block;color:inherit}
.cardlink:hover{text-decoration:none}
.cardtitle{font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.cardmeta{color:var(--muted);font-size:.85rem;margin-top:.3rem}
.grid{display:grid;gap:.85rem}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:.55rem 1.1rem;border-radius:8px;font-size:.92rem;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
form.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.3rem;margin:1rem 0}
label{display:block;font-size:.82rem;color:var(--muted);margin:.7rem 0 .25rem}
input[type=text],input[type=password],input,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:.6rem .7rem;border-radius:8px;font-family:var(--mono);font-size:.92rem;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
pre{background:#0b0d11;border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;
  overflow-x:auto;font-family:var(--mono);font-size:.84rem;color:#c9d1e0}
code{font-family:var(--mono);background:var(--surface-2);padding:.1rem .4rem;border-radius:5px;font-size:.88em}
.alert{border-radius:8px;padding:.75rem 1rem;margin-top:1rem;font-size:.92rem}
.alert.ok{background:var(--success-bg);color:var(--success);border:1px solid #1d5c44}
.alert.err{background:var(--danger-bg);color:var(--danger);border:1px solid #6b2630}
.payload-row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:.55rem .8rem;margin:.4rem 0}
.payload-row code{background:none;padding:0}
.copybtn{font-size:.75rem;padding:.25rem .6rem;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer}
.copybtn:hover{color:var(--accent);border-color:var(--accent)}
.tag-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 1rem}
footer{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem;color:var(--muted);font-size:.8rem;
  border-top:1px solid var(--border)}
</style>
</head>
<body>
<header class="top">
  <div class="topwrap">
    <div class="brand"><span class="dot"></span> Cyber-sec Lab</div>
    <nav><a href="/">Home</a></nav>
  </div>
</header>
<main>
  <div class="banner">⚠ Intentionally vulnerable lab app, built for a Cyber Security course assignment. Run on localhost only.</div>
  {% block content %}{% endblock %}
</main>
<footer>IIIT Allahabad · Cyber Security (IT-30001) · Autumn 2026</footer>
<script>
function copyPayload(btn, text){
  navigator.clipboard.writeText(text).then(()=>{
    const old = btn.textContent; btn.textContent = "Copied!";
    setTimeout(()=>btn.textContent = old, 1200);
  });
}
</script>
</body>
</html>
