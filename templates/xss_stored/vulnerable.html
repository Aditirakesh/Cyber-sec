{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Vulnerable Guestbook (Stored XSS)</h2>
    <div class="alert alert-warning">
        ⚠️ Intentionally vulnerable endpoint. The output is not encoded.
    </div>

    <form method="POST" class="mb-4">
        <div class="form-group">
            <input type="text" name="comment" class="form-control" placeholder="Leave a comment..." required>
        </div>
        <button type="submit" class="btn btn-danger mt-2">Post Comment</button>
    </form>

    <h4>Comments:</h4>
    <ul class="list-group">
    {% for comment in comments %} 
        <!-- VULNERABILITY: The |safe filter renders raw HTML/JS -->
        <li class="list-group-item">{{ comment|safe }}</li> 
    {% endfor %}
    </ul>
</div>
{% endblock %}
