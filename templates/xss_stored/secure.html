{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Secure Guestbook (Stored XSS)</h2>
    <div class="alert alert-success">
        ✅ Mitigated endpoint. Framework auto-escaping is active.
    </div>

    <form method="POST" class="mb-4">
        <div class="form-group">
            <input type="text" name="comment" class="form-control" placeholder="Leave a comment..." required>
        </div>
        <button type="submit" class="btn btn-success mt-2">Post Comment</button>
    </form>

    <h4>Comments:</h4>
    <ul class="list-group">
    {% for comment in comments %} 
        <!-- MITIGATION: Removed |safe. Input is automatically encoded -->
        <li class="list-group-item">{{ comment }}</li> 
    {% endfor %}
    </ul>
</div>
{% endblock %}
